name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # The API suite runs on every supported database: SQLite and PGlite in-process, and real
  # MySQL 8, MariaDB and Postgres servers here (vitest picks them up from TEST_*_URL).
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: sagegames
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psagegames"
          --health-interval=5s --health-timeout=5s --health-retries=30
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: sagegames
        ports: ['3307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: sagegames
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TEST_MYSQL_URL: mysql://root:sagegames@127.0.0.1:3306/mysql
      TEST_MARIADB_URL: mysql://root:sagegames@127.0.0.1:3307/mysql
      TEST_POSTGRES_URL: postgres://postgres:sagegames@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --include=dev --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Docs (links, anchors, compiling samples)
        run: npm run docs:check

  # Plays every game in a real browser (React Native views via react-native-web, and the web SDK)
  # with clicks, drags and taps, and checks the verified result screen.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --include=dev --legacy-peer-deps

      - name: Build packages
        run: npm run build:packages

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start playground
        run: npm run playground > playground.log 2>&1 &

      - name: Wait for playground
        run: npx wait-on http://localhost:5199 --timeout 60000

      - name: Play every game
        run: npm run test:ui

      # Two players race a battle through the real API (in-memory SQLite) over WebSockets.
      - name: Start battle server
        run: npm run battle-server > battle-server.log 2>&1 &

      - name: Wait for battle server
        run: npx wait-on tcp:127.0.0.1:4100 --timeout 60000

      - name: Play a battle
        run: npm run test:battle

      # The developer portal with a mocked API and session: pages must render without errors.
      - name: Build and serve the portal
        run: |
          npm run build -w services/portal
          (cd services/portal && npx vite preview --port 4174 --strictPort > ../../portal.log 2>&1 &)
          npx wait-on http://localhost:4174/portal/ --timeout 60000

      - name: Portal and docs pages
        run: npm run test:portal

      # The production server (--migrate) on a SQLite file: sign up, confirm, sign in, reset the
      # password in the real portal, then an app, keys, webhook, quiz bank and a verified game.
      - name: Full flow
        run: node tools/e2e/full-flow.mjs sqlite:./.e2e/sagegames.db

      - name: Server logs
        if: failure()
        run: cat playground.log battle-server.log portal.log

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: .ui-shots
